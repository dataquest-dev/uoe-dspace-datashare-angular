<!-- DATASHARE - start -->
<!--
  doiField mode (used for the DOI / "Persistent Identifier" field on the simple item view):
   - the field label/wrapper is ALWAYS shown (hideIfNoTextContent = false), even while a DOI is
     still queued for registration by the scheduled task (no https://doi.org value yet). This
     restores the previous behaviour where an (empty) DOI field was shown while registration was
     pending, instead of hiding the field entirely.
   - only DOI values (https://doi.org/...) are rendered as links; the handle is not shown here.
  Default mode keeps the upstream generic behaviour: every URI value is rendered as a link and the
  field is hidden when it has no value.
-->
<ds-metadata-field-wrapper *ngIf="doiField; else defaultUriValues" [label]="label | translate" [hideIfNoTextContent]="false">
    <ng-container *ngFor="let mdValue of mdValues; let last=last;">
        <a class="dont-break-out" *ngIf="mdValue.value.startsWith('https://doi.org')" [href]="mdValue.value"
            [target]="hasInternalLink(mdValue.value) ? '_self' : '_blank'" role="link" tabindex="0">
            {{ linktext || mdValue.value }}<span *ngIf="!last" [innerHTML]="separator"></span>
        </a>
    </ng-container>
</ds-metadata-field-wrapper>

<ng-template #defaultUriValues>
    <ds-metadata-field-wrapper [label]="label | translate">
        <a class="dont-break-out" *ngFor="let mdValue of mdValues; let last=last;" [href]="mdValue.value"
            [target]="hasInternalLink(mdValue.value) ? '_self' : '_blank'" role="link" tabindex="0">
            {{ linktext || mdValue.value }}<span *ngIf="!last" [innerHTML]="separator"></span>
        </a>
    </ds-metadata-field-wrapper>
</ng-template>
<!-- DATASHARE - end -->
