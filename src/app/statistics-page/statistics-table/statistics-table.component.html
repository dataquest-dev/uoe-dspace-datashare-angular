<div *ngIf="hasData"
     class="m-1">

  <h2 class="m-1">
    {{ 'statistics.table.title.' + report.reportType | translate }}
  </h2>

  <table class="table table-striped" [attr.data-test]="report.reportType">

    <tbody>

    <tr>
      <td></td>
      <th scope="col"
          *ngFor="let header of headers"
          class="{{header}}-header">
        {{ header }}
      </th>
    </tr>

    <tr *ngFor="let point of paginatedPoints"
        class="{{point.id}}-data">
      <th scope="row" data-test="statistics-label">
        {{ getLabel(point) | async }}
      </th>
      <td *ngFor="let header of headers"
          class="{{point.id}}-{{header}}-data">
        {{ point.values[header] }}
      </td>
    </tr>

    </tbody>

  </table>

  <div *ngIf="showPagination"
       class="d-flex justify-content-center">
    <ngb-pagination [collectionSize]="report.points.length"
                    [page]="currentPage"
                    [pageSize]="pageSize"
                    [maxSize]="5"
                    [rotate]="true"
                    [ellipses]="true"
                    [boundaryLinks]="true"
                    (pageChange)="onPageChange($event)"
                    [attr.aria-label]="'statistics.table.pagination.label' | translate">
    </ngb-pagination>
  </div>

</div>
